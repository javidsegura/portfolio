<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages serves this file for any path it cannot resolve, which is
      // every client-side route. Encode the requested path into a query string
      // and bounce to the app root; index.html decodes it back before React
      // mounts, so the router sees the original URL.
      //
      // PATH_SEGMENTS_TO_KEEP = 1 preserves the /portfolio project-site prefix.
      // Serving from a custom domain at the root means setting this to 0.
      (function () {
        var PATH_SEGMENTS_TO_KEEP = 1;
        var l = window.location;

        var base = l.pathname
          .split('/')
          .slice(0, 1 + PATH_SEGMENTS_TO_KEEP)
          .join('/');

        var route = l.pathname
          .slice(1)
          .split('/')
          .slice(PATH_SEGMENTS_TO_KEEP)
          .join('/')
          .replace(/&/g, '~and~');

        var query = l.search
          ? '&' + l.search.slice(1).replace(/&/g, '~and~')
          : '';

        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            base +
            '/?/' +
            route +
            query +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
